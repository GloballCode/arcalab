<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcaLab - Desafio Semanal</title>

    <!-- Favicon (identificação) -->
    <link rel="icon" type="image/jpeg" href="imgs/arcalab2.jpeg" />

    <!-- Bootstrap (pq temos q manter td certinho 😉😉) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@latest/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html"><img src="imgs/arcalab2.jpeg" alt="ArcaLab Logo" class="logo"></a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Experimentos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Atividades</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero text-center">
        <div class="container">
            <h1><i class="bi bi-flask-florence"></i> Desafio Semanal</h1>
            <p class="subtitle">Vulcão de Bicarbonato</p>
        </div>
    </section>

    <!-- CONTEÚDO -->
    <section class="container my-5">
        <div class="card p-4 challenge-card">

            <h3 class="text-center mb-4">🌋 Missão: Vulcão em Erupção</h3>

            <!-- PASSO 1 -->
            <div class="step">
                <label class="step-label">
                    <input type="checkbox" class="step-check">
                    <span class="step-number">1</span>
                    Prepare os materiais
                </label>
                <p>Separe bicarbonato, vinagre e um recipiente.</p>
            </div>

            <!-- PASSO 2 -->
            <div class="step">
                <label class="step-label">
                    <input type="checkbox" class="step-check">
                    <span class="step-number">2</span>
                    Monte o vulcão
                </label>
                <p>Separe bicarbonato, vinagre e um recipiente.</p>
            </div>

            <!-- PASSO 3 -->
            <div class="step">
                <label class="step-label">
                    <input type="checkbox" class="step-check">
                    <span class="step-number">3</span>
                    Hora da reação!
                </label>
                <p>Adicione o vinagre e observe a erupção 🌋.</p>
            </div>

            <!-- BOTÃO -->
            <button id="finishBtn" class="btn btn-success" disabled>
                Concluir Missão ✅
            </button>

        </div>
    </section>

</body>
<script src="script.js"></script>

</html>
